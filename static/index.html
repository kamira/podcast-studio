<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="studio-token" content="__STUDIO_TOKEN__">
<title>Podcast 工作室</title>
<link rel="stylesheet" href="/static/vendor/drawflow.min.css">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/vendor/drawflow.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>

<!-- 首頁:兩張卡片(精靈、完整模式)由 CHG-20261022-04 提供;這裡只放頁首與 ⚙ 入口 -->
<section id="page-home" class="page" data-page="home">
  <header class="page-header">
    <h1 class="page-title">Podcast 工作室</h1>
    <button type="button" class="icon-btn" id="open-settings" aria-label="設定" title="設定">⚙</button>
  </header>
  <main class="home-main">
    <p class="placeholder">首頁卡片(精靈、完整模式)建置中。請由右上角 ⚙ 進入設定,在「進階流程」編排與試跑節點流程。</p>
  </main>
</section>

<!-- 設定頁:由首頁右上角 ⚙ 開啟;子頁以連結切換,不是網頁分頁 -->
<section id="page-settings" class="page" data-page="settings" hidden>
  <header class="page-header">
    <a class="back-link" href="#/">← 首頁</a>
    <h1 class="page-title">設定</h1>
    <span class="icon-mark" aria-hidden="true">⚙</span>
  </header>
  <nav class="subnav" aria-label="設定子頁">
    <a class="subnav-link" href="#/settings/models" data-sub="models">模型</a>
    <a class="subnav-link" href="#/settings/seats" data-sub="seats">審議席位</a>
    <a class="subnav-link" href="#/settings/voice" data-sub="voice">語音預設</a>
    <a class="subnav-link" href="#/settings/flow" data-sub="flow">進階流程</a>
  </nav>

  <div class="subpage" data-sub="models" hidden>
    <p class="placeholder">「模型」子頁建置中。</p>
  </div>
  <div class="subpage" data-sub="seats" hidden>
    <p class="placeholder">「審議席位」子頁建置中。</p>
  </div>
  <div class="subpage" data-sub="voice" hidden>
    <p class="placeholder">「語音預設」子頁建置中。</p>
  </div>

  <!-- 設定 › 進階流程:節點畫布 -->
  <div class="subpage flow-page" data-sub="flow" hidden>
    <div class="flow-toolbar">
      <span class="flow-name" id="flow-name">流程:預設</span>
      <button type="button" class="btn" id="btn-load" disabled title="載入流程">載入</button>
      <button type="button" class="btn" id="btn-save" disabled title="存檔">存檔</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-primary" id="btn-run">▶ 執行</button>
      <button type="button" class="btn" id="btn-stop" disabled>■ 停止</button>
    </div>
    <div class="flow-body">
      <aside class="palette" id="palette" aria-label="節點清單">
        <h2 class="palette-title">節點清單</h2>
        <div id="palette-groups"></div>
        <p class="palette-hint">把節點拖到畫布,或點一下加入。</p>
        <div class="legend" aria-label="埠型別顏色">
          <span class="legend-item type-text">文字</span>
          <span class="legend-item type-image">圖片</span>
          <span class="legend-item type-audio">音訊</span>
          <span class="legend-item type-video">影片</span>
        </div>
      </aside>
      <div class="canvas-wrap">
        <div id="drawflow" class="canvas"></div>
        <p class="canvas-hint" aria-hidden="true">⇩ 把 .txt / 圖片 / 音檔拖到這裡,或拖到節點的輸入口取代它</p>
      </div>
    </div>
    <div class="statusbar" id="statusbar" role="status" aria-live="polite">尚未執行</div>
  </div>
</section>

<!-- 工作流程存檔 / 載入對話框(T11);沒有列出流程的端點,載入時輸入名稱 -->
<dialog id="wf-dialog" class="dialog" aria-labelledby="wf-dialog-title">
  <form id="wf-form" class="dialog-form" method="dialog" novalidate>
    <h2 id="wf-dialog-title" class="dialog-title">存檔</h2>
    <label class="dialog-field">
      <span class="dialog-label">流程名稱</span>
      <input id="wf-name" type="text" maxlength="64" autocomplete="off" spellcheck="false">
    </label>
    <p class="dialog-hint">可用中文、日文假名、英文字母、數字、底線、連字號,1 到 64 字</p>
    <p class="dialog-error" id="wf-error" role="alert" hidden></p>
    <div class="dialog-confirm" id="wf-confirm" hidden>
      <span>已有同名流程,要覆寫嗎?</span>
      <button type="button" class="btn btn-danger" id="wf-overwrite">覆寫</button>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn" id="wf-cancel">取消</button>
      <button type="submit" class="btn btn-primary" id="wf-submit">存檔</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="alert" hidden></div>

</body>
</html>
